    .hidden { display: none; }

    .bar-fill { height: 100%; border-radius: 3px; }

      </div>
    </div>
    <div style="display:flex; gap:6px; align-items:center;">
      <button type="button" onclick="sincronizarDesdeNube()" class="pill pill-green" id="badgeCloudStatus" style="cursor:pointer; border:none; font-weight:800;">☁️ SINCRONIZAR</button>
    </div>
  </header>

            <div><span style="font-size:10px; color:#94a3b8;">VOLADAS:</span> <b id="txtTotalVol" style="color:#fbbf24;">0.0 h</b></div>
          </div>
        </div>
        <div style="text-align:right;">
          <div style="font-size:10px; color:#94a3b8;">DISPONIBLES</div>
          <div id="txtTotalDisp" style="font-size:16px; font-weight:900; color:#34d399;">0.0 <span style="font-size:12px; color:#94a3b8; font-weight:normal;">h</span></div>
        </div>
      </div>
      <div style="margin-top:12px; display:flex; gap:8px;">
        <label class="pill pill-blue" style="cursor:pointer; padding:6px 12px; font-size:11px; text-align:center; flex:1;">
          📂 Cargar Parte Diario (.xlsx)
          <input type="file" id="excelFile" accept=".xlsx" style="display:none;" onchange="importarParteExcel(event)">
        </label>
      </div>
    </div>

    <div style="padding:0 12px; font-size:12px; font-weight:900; color:#f59e0b; text-transform:uppercase; margin-top:14px;">Línea Base Bogotá</div>

    <div id="listaAvionesHangar"></div>
  </div>

    function esDeBAMAV1(a) {
      if (a.manualBAMAV1 === true) return true;
      if (a.manualBAMAV1 === false) return false;
      var p = String(a.pernocta || "").toUpperCase();
      return p.indexOf("BAMAV") !== -1 || p.indexOf("HANGAR") !== -1 || a.estado === "AMP" || a.estado === "AMI" || a.estado === "EVA" || a.estado === "PAR" || a.estado === "APB";
    }

    function toggleUbicacionAvion(idAvion) {
      var av = flota.find(function(a) { return a.id === idAvion || a.matricula === idAvion; });
      if (!av) return;
      av.manualBAMAV1 = !esDeBAMAV1(av);
      av.pernocta = av.manualBAMAV1 ? "BAMAV-1" : "BOGOTÁ";
      if (av.manualBAMAV1) {
        if (!av.fechaIngresoManto) av.fechaIngresoManto = new Date().toISOString().slice(0, 10);
        if (!av.fechaSalidaManto) av.fechaSalidaManto = "Indefinido";
      }
      guardarDatos();
      renderFlota();
      renderRampa();
      poblarSelectorSimulador();
      guardarEnNube(flota);
    }

    function editarFechaSalida(matricula) {
      var av = flota.find(function(a) { return a.matricula === matricula || a.id === matricula; });
      if (!av) return;
      var actual = av.fechaSalidaManto || "Indefinido";
      var nueva = prompt("Ingrese la nueva fecha estimada de entrega para " + av.matricula + ":", actual);
      if (nueva !== null && nueva.trim() !== "") {
        av.fechaSalidaManto = nueva.trim();
        av.fechaSalidaManual = true;
        guardarDatos();
        renderFlota();
        guardarEnNube(flota);
        alert("✅ Fecha de entrega actualizada.");
      }
    }

    function guardarDatos() {
      try { localStorage.setItem(CLAVE_STORE, JSON.stringify(flota)); } catch(e) {}
      renderFlota();
    }

    function guardarEnNube(datosFlota) {

      var badge = document.getElementById("badgeCloudStatus");
      if (badge) badge.innerText = "☁️ SUBIENDO...";
      return fetch(FIREBASE_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(datosFlota)
      })
      .then(function(res) { return res.json(); })
      .then(function(resp) {
        if (badge) { badge.innerText = "☁️ EN LÍNEA"; badge.className = "pill pill-green"; }
        return resp;
      })
      .catch(function(err) {
        if (badge) { badge.innerText = "LOCAL"; badge.className = "pill pill-amber"; }
      });
    }

    function sincronizarDesdeNube() {
      fetch(FIREBASE_URL)
        .then(function(res) { return res.json(); })
        .then(function(data) {
          if (data && Array.isArray(data) && data.length >= 10) {
            flota = data;
            try { localStorage.setItem(CLAVE_STORE, JSON.stringify(flota)); } catch(e) {}
            renderFlota();
            renderRampa();
            poblarSelectorSimulador();
          }
        }).catch(function(e){});
    }

    function renderFlota() {
      var contBog = document.getElementById("listaAvionesBogota");
      var contDiv = document.getElementById("listaAvionesDivision");
      var contHangar = document.getElementById("listaAvionesHangar");
      if (!contBog || !contDiv || !contHangar) return;

      contBog.innerHTML = "";
      contDiv.innerHTML = "";
      contHangar.innerHTML = "";

      var totAsig = 0, totVol = 0;

      for (var i = 0; i < flota.length; i++) {

        var a = flota[i];
        if (!a) continue;

        var asigNum = Number(a.asignadas) || 0;
        var volNum = Number(a.voladasMes || a.voladas) || 0;
        var dispMes = Number(a.dispMes || (asigNum - volNum)) || 0;
        if (dispMes < 0) dispMes = 0;
        dispMes = dispMes.toFixed(1);

        var pctMes = asigNum > 0 ? Math.min(100, Math.round((volNum / asigNum) * 100)) : 0;
        var totCelula = (Number(a.horasActuales || a.tot || a.celula) || 0).toFixed(1);
        var proxFase = (Number(a.proximaFase) || 0).toFixed(1);
        var remFaseNum = Number(a.remFase || a.rem) || 0;
        var remFase = remFaseNum.toFixed(1);

        var pillFase = "pill-green";
        if (remFaseNum <= 5.0) pillFase = "pill-red";
        else if (remFaseNum <= 20.0) pillFase = "pill-amber";

        var sp = (typeof CONFIG !== "undefined" && CONFIG[a.tipoSpecs || a.modelo]) ? CONFIG[a.tipoSpecs || a.modelo] : { nombre: a.modelo || "Aeronave", maxPax: 7, velKT: 200 };

        var card = document.createElement("div");
        card.className = "card";

        var btnAccion = esDeBAMAV1(a) ?
          '<button type="button" onclick="event.stopPropagation(); toggleUbicacionAvion(\'' + a.id + '\')" class="pill pill-green" style="border:none; cursor:pointer; font-weight:800; font-size:10px; padding:4px 8px;">🔺 A BOGOTÁ</button>' :
          '<button type="button" onclick="event.stopPropagation(); toggleUbicacionAvion(\'' + a.id + '\')" class="pill pill-amber" style="border:none; cursor:pointer; font-weight:800; font-size:10px; padding:4px 8px;">🔻 A BAMAV-1</button>';

        var boxManto = "";
        if (esDeBAMAV1(a)) {
          var fSalida = a.fechaSalidaManto || "Indefinido";
          boxManto = '<div style="margin-top:6px; font-size:11px; color:#f87171; background:rgba(244,63,94,0.1); padding:6px; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">' +
            '<span>🔧 Ingreso Manto: <b>' + (a.fechaIngresoManto || "N/A") + '</b></span>' +
            '<span onclick="event.stopPropagation(); editarFechaSalida(\'' + a.matricula + '\')" style="cursor:pointer; background:#1e293b; padding:2px 8px; border-radius:4px; border:1px solid #38bdf8; color:#38bdf8; font-weight:700;">Entrega: ' + fSalida + ' ✏️</span></div>';
        }

        card.innerHTML = '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:4px;">' +
          '<div><div style="font-weight:900; font-size:15px; color:#f8fafc;">' + a.matricula + ' <span style="font-size:11px; font-weight:normal; color:#94a3b8;">(' + sp.nombre + ')</span></div>' +
          '<div style="margin-top:2px;"><span class="pill pill-green">' + (a.estado || 'ACL') + '</span> <span class="pill pill-blue" style="margin-left:4px;">📍 ' + a.pernocta + '</span></div></div>' +
          '<div>' + btnAccion + '</div></div>' +
          '<div style="display:flex; justify-content:space-between; font-size:11px; color:#cbd5e1; margin-top:6px;">' +
          '<span>Cupo: <b>' + asigNum.toFixed(1) + ' h</b></span><span>Voladas: <b>' + volNum.toFixed(1) + ' h</b></span><span>Restan: <b style="color:' + (dispMes <= 3 ? '#f87171' : '#10b981') + '">' + dispMes.toFixed(1) + ' h</b></span></div>' +
          boxManto;

        if (esDeBAMAV1(a)) {
          contHangar.appendChild(card);
        } else if (String(a.pernocta || "").toUpperCase().indexOf("BOGOT") !== -1) {
          contBog.appendChild(card);
        } else {
          contDiv.appendChild(card);
        }
      }

      document.getElementById("txtTotalAsig").innerText = totAsig.toFixed(1) + " h";
      document.getElementById("txtTotalVol").innerText = totVol.toFixed(1) + " h";
      document.getElementById("txtTotalDisp").innerHTML = Math.max(0, totAsig - totVol).toFixed(1) + ' <span style="font-size:12px; color:#94a3b8; font-weight:normal;">h</span>';
    }

    function poblarSelectorSimulador() {
      var sel = document.getElementById("simAeronave");
      if (!sel) return;
      var selVal = sel.value;
      sel.innerHTML = '<option value="">-- Seleccionar Aeronave --</option>';

      var disponibles = flota.filter(function(a) {
        return !esDeBAMAV1(a) && String(a.pernocta || "").toUpperCase().indexOf("BOGOT") !== -1;
      });

      disponibles.forEach(function(a) {
        var opt = document.createElement("option");
        opt.value = a.matricula;
        opt.innerText = a.matricula + " (" + a.modelo + ") • Ubicación: " + a.pernocta;
        sel.appendChild(opt);
      });
      if (selVal) sel.value = selVal;
    }

    function renderRampa() {
      var cont = document.getElementById("selectorRampa");
      if (!cont) return;
      cont.innerHTML = "";

      flota.forEach(function(a) {
        if (esDeBAMAV1(a)) return;
        var btn = document.createElement("button");
        btn.className = "pill";
        btn.style.cssText = "padding:10px; text-align:left; cursor:pointer; background:" + (avionSeleccionado === a.id ? "#f59e0b; color:#000;" : "#1e293b; color:#f8fafc;");
        btn.innerHTML = '<b>' + a.matricula + '</b><br><span style="font-size:9px; color:#94a3b8;">' + a.pernocta + '</span>';
        btn.onclick = function() { avionSeleccionado = a.id; renderRampa(); };
        cont.appendChild(btn);
      });
    }

    function ajustarHoras(delta) {
      var el = document.getElementById("rampaHoras");
      el.value = Math.max(0.1, (parseFloat(el.value) || 0) + delta).toFixed(1);
    }

    function descontarHoras() {
      var a = flota.find(function(x) { return x.id === avionSeleccionado; });
      var h = parseFloat(document.getElementById("rampaHoras").value) || 0;
      if (!a || h <= 0) { alert("Seleccione una aeronave y un valor de horas válido."); return; }
      a.voladasMes = (Number(a.voladasMes) || 0) + h;
      guardarDatos();
      guardarEnNube(flota);
      alert("✅ Registradas +" + h.toFixed(1) + " h a " + a.matricula);
    }

    function calcularSimulacionRapida() {
      var mat = document.getElementById("simAeronave").value;
      var etd = document.getElementById("simETD").value || "08:00";
      var pax = document.getElementById("simPax").value || "0";
      var carga = document.getElementById("simCarga").value || "";
      var obs = document.getElementById("simObs").value || "";
      var rutaTxt = document.getElementById("simRutaTxt").value.trim().toUpperCase();

      if (!mat || !rutaTxt) {
        document.getElementById("resultadoSimulacion").classList.add("hidden");
        return;
      }

      var av = flota.find(function(x) { return x.matricula === mat; });
      if (!av) return;

      var tramos = rutaTxt.split("-").map(function(s){ return s.trim(); }).filter(Boolean);
      if (tramos.length < 2) return;

      var distTotal = 0;
      for (var i = 0; i < tramos.length - 1; i++) {
        var a1 = AEROPUERTOS[tramos[i]], a2 = AEROPUERTOS[tramos[i+1]];
        if (a1 && a2) {
          var R = 3440.065;
          var dLat = (a2.lat - a1.lat) * Math.PI / 180;
          var dLon = (a2.lon - a1.lon) * Math.PI / 180;
          var lat1 = a1.lat * Math.PI / 180, lat2 = a2.lat * Math.PI / 180;
          var x = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLon/2)*Math.sin(dLon/2);
          distTotal += R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1-x));
        }
      }

      var vel = (CONFIG[av.tipoSpecs] || CONFIG[av.modelo] || {}).velKT || 200;
      var horasVuelo = distTotal / vel;

      misionActualTemp = {
        matricula: av.matricula,
        modelo: av.modelo,
        siglaMilitar: av.modelo,
        etd: etd,
        ruta: tramos,
        pax: pax,
        carga: carga,
        obs: obs,
        horas: horasVuelo
      };

      var resDiv = document.getElementById("resultadoSimulacion");
      resDiv.innerHTML = '<div style="font-size:12px; font-weight:900; margin-bottom:6px; color:#34d399;">PLAN CALCULADO: ' + tramos.join(" ➔ ") + ' (' + horasVuelo.toFixed(1) + ' h)</div>' +
        '<button onclick="agregarMisionALaOrden()" style="width:100%; background:#38bdf8; border:none; color:#000; font-weight:900; padding:10px; border-radius:6px; cursor:pointer; text-transform:uppercase;">➕ Agregar a la Orden de Vuelo</button>';
      resDiv.classList.remove("hidden");
    }

    function agregarMisionALaOrden() {
      if (!misionActualTemp) return;
      misionesS3.push(misionActualTemp);
      try { localStorage.setItem("BAAV1_MISIONES_S3_PROD", JSON.stringify(misionesS3)); } catch(e){}
      misionActualTemp = null;
      document.getElementById("resultadoSimulacion").classList.add("hidden");
      renderListaMisionesS3();
      alert("✅ Misión agregada a la orden S-3.");
    }

    function renderListaMisionesS3() {
      var cont = document.getElementById("listaMisionesS3Container");
      if (!cont) return;
      if (!misionesS3.length) {
        cont.innerHTML = '<div style="color:#64748b; font-size:11px;">No hay misiones en la orden.</div>';
        return;
      }
      misionesS3.sort(function(a, b) { return (a.etd || "").localeCompare(b.etd || ""); });
      cont.innerHTML = misionesS3.map(function(m, idx) {
        return '<div style="background:#0f172a; padding:8px; border-radius:6px; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; font-size:11px;">' +
          '<div><b>' + m.matricula + '</b> • ' + m.etd + ' • Ruta: ' + m.ruta.join("-") + '</div>' +
          '<button onclick="misionesS3.splice(' + idx + ', 1); renderListaMisionesS3();" style="background:none; border:none; color:#f87171; cursor:pointer; font-weight:900;">✕</button></div>';
      }).join('');
    }

    function obtenerNombreCiudad(code) {
      return (AEROPUERTOS[code] || {}).nombre || code;
    }

    function generarTextoOrdenRadioperador() {
      if (!misionesS3 || !misionesS3.length) return "No hay misiones programadas.";
      misionesS3.sort(function(a, b) { return (a.etd || "").localeCompare(b.etd || ""); });

      var unidadSel = document.getElementById("simUnidad") ? document.getElementById("simUnidad").value : "";
      var txt = "*ORDEN DE VUELO S-3 BAAV1*\\n\\n";

      for (var i = 0; i < misionesS3.length; i++) {
        var m = misionesS3[i];
        var ciudadesRuta = [];
        if (m.ruta && Array.isArray(m.ruta)) {
          for (var j = 0; j < m.ruta.length; j++) {
            ciudadesRuta.push(obtenerNombreCiudad(m.ruta[j]));
          }
        }
        var rutaFormateada = ciudadesRuta.join(" - ");
        var matLimpia = m.matricula.replace("-", " ");
        var paxNum = parseInt(m.pax) || 0;
        var paxStr = paxNum < 10 ? "0" + paxNum : String(paxNum);
        var cargaStr = m.carga ? m.carga : "00 lbs.";
        var obsStr = m.obs ? m.obs : "Transporte de personal y material.";
        var modeloSigla = m.siglaMilitar || m.modelo;

        if (unidadSel) {
          txt += "✅Unidad: " + unidadSel + "\\n";
        } else {
          txt += "✅Unidad: \\n";
        }
        txt += matLimpia + " " + modeloSigla + " *" + m.etd + "*\\n";
        txt += "Ruta: " + rutaFormateada + ".\\n";
        txt += "Realizará " + obsStr.trim().replace(/\\.$/, "") + ".\\n";
        txt += "Tarea: \\n";
        txt += "Pax: " + paxStr + "\\n";
        txt += "Carga: " + cargaStr + "\\n\\n";
      }

      var totVuelosStr = misionesS3.length < 10 ? "0" + misionesS3.length : String(misionesS3.length);
      txt += "*TOTAL VUELOS A REALIZAR: " + totVuelosStr + "*\\n\\n";
      txt += "A su orden permanezco QAP mi coronel.";
      return txt;
    }

    function enviarWhatsAppRadioperador() {
      var t = generarTextoOrdenRadioperador();
      window.open("https://api.whatsapp.com/send?text=" + encodeURIComponent(t), "_blank");
    }

    function importarParteExcel(e) {
      var file = e.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(evt) {
        try {
          var data = new Uint8Array(evt.target.result);
          var workbook = XLSX.read(data, { type: 'array' });
          var sheet = workbook.Sheets[workbook.SheetNames[0]];
          var rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
          
          var actualizados = 0;
          for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var cola = String(r[1] || "").trim().toUpperCase();
            if (!cola) continue;
            for (var j = 0; j < flota.length; j++) {
              if (flota[j].matricula.replace("-", "") === cola.replace("-", "")) {
                var a = flota[j];
                if (r[6]) a.horasActuales = parseFloat(r[6]) || a.horasActuales;
                if (r[7]) a.proximaFase = parseFloat(r[7]) || a.proximaFase;
                if (r[10]) a.asignadas = parseFloat(r[10]) || a.asignadas;
                if (r[11]) a.voladasMes = parseFloat(r[11]) || a.voladasMes;
                if (r[16] && String(r[16]).trim() !== "NAN") {
                  var p = String(r[16]).trim().toUpperCase();
                  if (!a.fechaSalidaManual) {
                    a.pernocta = p.indexOf("BOGOT") !== -1 ? "BOGOTÁ" : (p.indexOf("BAMAV") !== -1 ? "BAMAV-1" : p);
                  }
                }
                actualizados++;
                break;
              }
            }
          }
          guardarDatos();
          guardarEnNube(flota);
          alert("✅ Parte diario procesado con éxito. Aeronaves actualizadas: " + actualizados);
        } catch(err) {
          alert("Error leyendo Excel: " + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function cambiarVista(vista) {
      var v = ['flota', 'simulador', 'rampa'];
      for (var i = 0; i < v.length; i++) {
        document.getElementById('view-' + v[i]).className = (v[i] === vista ? '' : 'hidden');
        document.getElementById('btn-' + v[i]).className = 'nav-btn' + (v[i] === vista ? ' active' : '');
      }
      if (vista === 'simulador') { poblarSelectorSimulador(); renderListaMisionesS3(); }
      if (vista === 'rampa') renderRampa();
    }

    document.addEventListener("DOMContentLoaded", function() {
      guardarDatos();
      sincronizarDesdeNube();
      setInterval(sincronizarDesdeNube, 15000);
    });
  </script>
